name: TaxTrace CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # BACKEND TESTS
  # ============================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -U pip
          pip install -e .[dev]

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres-test \
            -e POSTGRES_USER=taxtrace \
            -e POSTGRES_PASSWORD=taxtrace \
            -e POSTGRES_DB=taxtrace \
            -p 5432:5432 \
            postgres:16-alpine
          sleep 5

      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://taxtrace:taxtrace@localhost:5432/taxtrace
          APP_ENV: test
          SECRET_KEY: test-secret-key-minimum-32-characters-long
        run: |
          pytest tests/ -v --tb=short

      - name: Run reconciliation benchmark
        working-directory: ./
        env:
          DATABASE_URL: postgresql://taxtrace:taxtrace@localhost:5432/taxtrace
          APP_ENV: test
          SECRET_KEY: test-secret-key-minimum-32-characters-long
        run: |
          python -m evaluations.benchmark_reconciliation

      - name: Run AI quality gates
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://taxtrace:taxtrace@localhost:5432/taxtrace
          APP_ENV: test
          SECRET_KEY: test-secret-key-minimum-32-characters-long
        run: |
          pytest tests/test_ai_quality_gates.py -v --tb=short

      - name: Run security audit
        working-directory: ./backend
        run: |
          python -m scripts.security_audit

  # ============================================================
  # FRONTEND TESTS
  # ============================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        working-directory: ./frontend
        run: npx vitest run

      - name: Run TypeScript type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  # ============================================================
  # DOCKER BUILD (verify only, no push)
  # ============================================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: taxtrace-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: taxtrace-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # NOTIFICATION
  # ============================================================
  notify:
    name: Notify Result
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, docker-build]
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.backend-tests.result }}" == "success" && "${{ needs.frontend-tests.result }}" == "success" && "${{ needs.docker-build.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Send notification
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          STATUS="${{ steps.status.outputs.status }}"
          if [ "$STATUS" = "success" ]; then
            COLOR="good"
            MESSAGE="✅ TaxTrace CI Pipeline PASSED"
          else
            COLOR="danger"
            MESSAGE="❌ TaxTrace CI Pipeline FAILED"
          fi
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"attachments\":[{\"color\":\"$COLOR\",\"text\":\"$MESSAGE\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}" \
            $SLACK_WEBHOOK_URL
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}