[project]
name = "taxtrace"
version = "0.1.0"
description = "TaxTrace AI compliance execution platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.3",
  "pydantic-settings>=2.3.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27.2",
  "aiosqlite>=0.20.0",
  "PyJWT>=2.9.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.setuptools.packages.find]
where = ["backend"]
